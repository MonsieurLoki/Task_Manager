<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Tâches</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-tasks"></i> Gestionnaire de Tâches</h1>
            <div class="date-selector">
                <button id="prevDate" class="btn-icon"><i class="fas fa-chevron-left"></i></button>
                <input type="date" id="selectedDate" class="date-input">
                <button id="nextDate" class="btn-icon"><i class="fas fa-chevron-right"></i></button>
                <button id="todayBtn" class="btn-secondary">Aujourd'hui</button>
            </div>
        </header>

        <main class="main-content">
            <div class="task-form-container">
                <form id="taskForm" class="task-form">
                    <div class="form-group">
                        <input type="text" id="taskTitle" placeholder="Titre de la tâche" required>
                    </div>
                    <div class="form-group">
                        <textarea id="taskDescription" placeholder="Description (optionnelle)"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-plus"></i> Ajouter une tâche
                    </button>
                </form>
            </div>

            <div class="tasks-container">
                <div class="tasks-header">
                    <h2>Tâches du <span id="currentDateDisplay"></span></h2>
                    <div class="stats">
                        <span id="completedCount">0</span> / <span id="totalCount">0</span> complétées
                    </div>
                </div>

                <div id="tasksList" class="tasks-list">
                    <!-- Les tâches seront ajoutées ici dynamiquement -->
                </div>

                <div id="noTasks" class="no-tasks" style="display: none;">
                    <i class="fas fa-clipboard-list"></i>
                    <p>Aucune tâche pour cette date</p>
                    <p>Ajoutez votre première tâche ci-dessus !</p>
                </div>
            </div>
        </main>

        <!-- Modal pour éditer une tâche -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Modifier la tâche</h3>
                    <button id="closeModal" class="btn-icon"><i class="fas fa-times"></i></button>
                </div>
                <form id="editForm" class="task-form">
                    <div class="form-group">
                        <input type="text" id="editTitle" placeholder="Titre de la tâche" required>
                    </div>
                    <div class="form-group">
                        <textarea id="editDescription" placeholder="Description (optionnelle)"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="cancelEdit" class="btn-secondary">Annuler</button>
                        <button type="submit" class="btn-primary">Sauvegarder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
